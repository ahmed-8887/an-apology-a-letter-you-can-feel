[build]
  base = "."
  publish = "frontend/dist"
  command = "npm run build"
  functions = "netlify/functions"

# API Route Redirects
[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

[[redirects]]
  from = "/api/track/*"
  to = "/.netlify/functions/track"
  status = 200

[[redirects]]
  from = "/api/send-message"
  to = "/.netlify/functions/send-message"
  status = 200

[[redirects]]
  from = "/api/photo/:*"
  to = "/.netlify/functions/photo"
  status = 200

[[redirects]]
  from = "/api/photo/*"
  to = "/.netlify/functions/photo"
  status = 200

[[redirects]]
  from = "/api/audio/:*"
  to = "/.netlify/functions/audio"
  status = 200

[[redirects]]
  from = "/api/audio/*"
  to = "/.netlify/functions/audio"
  status = 200

# SPA Catch-All
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
